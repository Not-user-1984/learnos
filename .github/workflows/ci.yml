# CI LearnOS: гоняется на GitHub-зеркале (деплой на CT тянет с него же).
# GitVerse держит зеркало; прод дополнительно защищён CI-гейтом в
# learnos-deploy.sh (тесты в свежем образе до docker compose up).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    name: "Сервер: ruff + import-linter + pytest"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run lint-imports
      - run: uv run pytest -q

  web:
    name: "Веб: eslint + tsc + build"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
