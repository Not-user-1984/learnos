[project]
name = "learnos-server"
version = "0.2.0"
description = "LearnOS: персональная система обучения с ИИ — модульное ядро (REST + MCP + агенты + KB)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "mcp>=2.0",
    "httpx[socks]>=0.27",
    "pyyaml>=6.0",
    "pymupdf>=1.24",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic-settings>=2.2",
    "openai>=1.40",
    "python-multipart>=0.0.9",
    "anyio>=4.4",
    "jinja2>=3.1",
    "yt-dlp[curl-cffi]>=2025.1.1",
    "beautifulsoup4>=4.15.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "import-linter>=2.0",
    "respx>=0.21",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
"migrations/*" = ["E501", "E402"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["fitz", "alembic.*", "mcp.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["app"]
omit = ["app/cli.py"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.importlinter]
root_packages = ["app"]
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
name = "Kernel, llm и agent не зависят от модулей"
type = "forbidden"
source_modules = ["app.kernel", "app.llm", "app.agent"]
forbidden_modules = ["app.modules"]

[[tool.importlinter.contracts]]
name = "Домены не зависят от инфраструктуры и presentation"
type = "forbidden"
source_modules = ["app.modules.*.domain"]
forbidden_modules = ["app.modules.*.infra", "app.modules.*.api", "app.modules.*.tools"]

[[tool.importlinter.contracts]]
name = "Модули не импортируют infra друг друга"
type = "independence"
modules = ["app.modules.*.infra"]
