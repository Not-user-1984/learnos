# LearnOS: ядро (FastAPI+MCP) + веб (Next.js). Данные — в ./data и ./kb хоста.
services:
  server:
    build: ./server
    container_name: learnos-server
    restart: unless-stopped
    environment:
      LEARNOS_DATA_DIR: /data
      LEARNOS_KB_DIR: /kb
      LEARNOS_SKILLS_DIR: /app/skills
      # ключи пробрасываются из окружения (sec exec); Telegram-мост — при наличии токена
      ZAI_API_KEY: ${ZAI_API_KEY:-}
      LEARNOS_TELEGRAM_TOKEN: ${LEARNOS_TELEGRAM_TOKEN:-}
      LEARNOS_TELEGRAM_PROXY: ${LEARNOS_TELEGRAM_PROXY:-socks5://host.docker.internal:7890}
      LEARNOS_YT_PROXY: ${LEARNOS_YT_PROXY:-socks5://host.docker.internal:7890}
      LEARNOS_WEB_PROXY: ${LEARNOS_WEB_PROXY:-}
    volumes:
      - ./data:/data
      - ./kb:/kb
    ports:
      - "8765:8765"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  web:
    build: ./web
    container_name: learnos-web
    restart: unless-stopped
    depends_on:
      - server
    environment:
      LEARNOS_API_URL: http://server:8765
    ports:
      - "3000:3000"
