# LearnOS: ядро (FastAPI+MCP) + веб (Next.js) + xray-sidecar (vless→socks5). Данные — в ./data и ./kb.
services:
  server:
    build: ./server
    container_name: learnos-server
    restart: unless-stopped
    environment:
      LEARNOS_DATA_DIR: /data
      LEARNOS_KB_DIR: /kb
      LEARNOS_SKILLS_DIR: /app/skills
      # ключи пробрасываются из окружения (sec exec); поиск/прокси — в настройках UI (/api/connectivity)
      # цепочка ключей GLM: ротация при исчерпании квоты (T-040), порядок = порядок в llm.yaml
      ZAI_API_KEY: ${ZAI_API_KEY:-}
      ZAI_API_KEY_2: ${ZAI_API_KEY_2:-}
      ZAI_API_KEY_3: ${ZAI_API_KEY_3:-}
      ZAI_API_KEY_4: ${ZAI_API_KEY_4:-}
      LEARNOS_TELEGRAM_TOKEN: ${LEARNOS_TELEGRAM_TOKEN:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      SERPER_API_KEY: ${SERPER_API_KEY:-}
      # R-07: bearer-токен API (пусто — auth выключен)
      LEARNOS_API_TOKEN: ${LEARNOS_API_TOKEN:-}
      # ревизия кода агентом-аудитором (T-038): git-рабочая копия, видимая из контейнера;
      # пусто — инструменты ревизии отвечают «не настроено». rw с B-011: git worktree
      # (ветки agent/*) пишет в .git рабочей копии; правки кода идут только через worktree
      LEARNOS_REPO_ROOT: ${LEARNOS_REPO_ROOT:-}
      # GitHub-токен с правом push: accept веток agent/* = push + PR через REST (B-011)
      LEARNOS_GITHUB_TOKEN: ${LEARNOS_GITHUB_TOKEN:-}
    volumes:
      - ./data:/data
      - ./kb:/kb
      # рабочая копия деплоя: rw — git worktree для веток агента пишет в её .git (B-011)
      - ./:/repo
      # песочница скиллов (R-06): секреты .env и живая база ./data не видны из /repo
      # (пустая маска поверх маунта; секреты ходят только через env контейнера)
      - /dev/null:/repo/.env:ro
      - ./deploy/repo-mask/data:/repo/data:ro
    ports:
      - "8765:8765"
    # G аудита: контейнер честно сообщает о себе (depends_on web ждёт живой сервер)
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8765/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    extra_hosts:
      - "host.docker.internal:host-gateway"

  xray:
    # vless-ключ из настроек UI → socks5://xray:1080 для всего стека (поиск/YouTube/Telegram)
    image: teddysun/xray:latest
    container_name: learnos-xray
    restart: unless-stopped
    volumes:
      - ./data/xray:/etc/xray
      - ./deploy/xray/loop.sh:/opt/loop.sh:ro
    entrypoint: ["/bin/sh", "/opt/loop.sh"]

  web:
    build: ./web
    container_name: learnos-web
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    environment:
      LEARNOS_API_URL: http://server:8765
      # R-07: прокси добавляет bearer на сервере; браузер токен не видит
      LEARNOS_API_TOKEN: ${LEARNOS_API_TOKEN:-}
    ports:
      - "3000:3000"
